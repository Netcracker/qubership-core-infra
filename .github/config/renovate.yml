---
assignAutomerge: true
assigneesFromCodeOwners: true
autodiscover: false
binarySource: "install"
branchConcurrentLimit: 25
enabled: true
globalExtends:
  - ":ignoreModulesAndTests"
  - ":dependencyDashboard"
extends:
  - ":semanticCommitTypeAll(chore)"
semanticCommits: "enabled"
minimumReleaseAge: "0 days"
hostRules:
  - hostType: "maven"
    matchHost: "maven.pkg.github.com"
    token: "{{ secrets.renovation_bot_private_packages_read }}"
packageRules:
  - matchManagers: [ "maven" ]
    matchPackageNames: [ "/.*/" ]
    addLabels: [ "manager:maven" ]
  - matchManagers: [ "dockerfile" ]
    matchPackageNames: [ "/.*/" ]
    addLabels: [ "manager:docker" ]
  - matchManagers: [ "gomod" ]
    matchPackageNames: [ "/.*/" ]
    addLabels: [ "manager:go" ]
  - matchManagers: [ "github-actions" ]
    matchPackageNames: [ "/.*/" ]
    addLabels: [ "manager:github-actions" ]
  - matchPackageNames:
      - "/.*/"
    allowedVersions: "!/.*(redhat|composite|groovyless|jboss|atlassian|preview|does-not-exist|-SNAPSHOT).*/"
  - matchDatasources: [ "maven" ]
    registryUrls:
      - "https://maven-central.storage-download.googleapis.com/maven2"
      - "https://maven.pkg.github.com/netcracker/*"
  - description: "Netcracker artifacts are published to GitHub Packages only: do not query Maven Central for them"
    matchDatasources: [ "maven" ]
    matchPackageNames: [ "/^com\\.netcracker\\./" ]
    registryUrls:
      - "https://maven.pkg.github.com/netcracker/*"
  - description: "Inter-module SNAPSHOT dependencies are managed by the release process, not by Renovate: skip their lookups"
    matchDatasources: [ "maven" ]
    matchCurrentValue: "/-SNAPSHOT$/"
    enabled: false
  - matchDatasources: [ "docker" ]
    matchPackageNames: [ "golang" ]
    separateMinorPatch: true
  - description: "Java major: the Java version (21 in the eclipse-temurin:21-jre-alpine-3.24 image, java-version: '21' in actions/setup-java) is chosen deliberately, usually an LTS, and is not bumped by Renovate. Updates within the major and digest updates still come."
    matchDatasources: [ "docker", "java-version" ]
    matchPackageNames: [ "eclipse-temurin", "**/eclipse-temurin", "java-jdk", "java-jre" ]
    matchUpdateTypes: [ "major" ]
    enabled: false
  - description: "OpenTelemetry instrumentation must match the OpenTelemetry SDK managed by Spring Boot (Boot 4.1.x -> SDK 1.62.0 -> instrumentation 2.28.x). Update together with Spring Boot's OpenTelemetry version."
    matchPackageNames:
      - "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom"
      - "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha"
    allowedVersions: "/^2\\.28\\./"
  - description: "Quarkus platform BOMs share one version (usually one quarkus.platform.version property). Only quarkus-bom and quarkus-maven-plugin get the generated Quarkus pin, so any other io.quarkus.platform artifact (e.g. quarkus-operator-sdk-bom) would bump the shared property past the pin. Disable them; if java-libs starts using another platform BOM, add it to the exclusions so the generator pins it."
    matchDatasources: [ "maven" ]
    matchPackageNames:
      - "/^io\\.quarkus\\.platform:/"
      - "!io.quarkus.platform:quarkus-bom"
      - "!io.quarkus.platform:quarkus-maven-plugin"
    enabled: false
  - description: "Surefire/Failsafe 3.6.0 breaks tests that self-attach a Java agent (Mockito inline mock maker, system-stubs): its StackWalkerStrategy static init calls loadClass on the context class loader, which is null in the JVM Attach Listener thread, so agent attach fails with NoClassDefFoundError. Exclude only the broken release; extend the list if the next one still fails."
    matchPackageNames:
      - "org.apache.maven.plugins:maven-surefire-plugin"
      - "org.apache.maven.plugins:maven-failsafe-plugin"
    allowedVersions: "!/^3\\.6\\.0$/"
  - description: "Go libraries: automerge non-major Go module updates once every status check on the branch is green."
    matchRepositories: [ "/^netcracker\\/qubership-core-lib-go(-|$)/i" ]
    matchManagers: [ "gomod" ]
    matchUpdateTypes: [ "minor", "patch", "digest" ]
    automerge: true
    automergeType: "pr"
    platformAutomerge: false
  - description: "All repositories: automerge non-major GitHub Actions updates once every status check on the branch is green. Digest is included because actions are pinned by SHA with a major tag comment, so most in-major updates arrive as digest. Releases age 3 days first, so a moved or replaced tag is not merged at once."
    matchManagers: [ "github-actions" ]
    matchUpdateTypes: [ "minor", "patch", "digest" ]
    automerge: true
    automergeType: "pr"
    platformAutomerge: false
    minimumReleaseAge: "3 days"
  - description: "Go libraries: let third-party releases age 3 days before the automerge above can pick them up. Our own modules are not delayed."
    matchRepositories: [ "/^netcracker\\/qubership-core-lib-go(-|$)/i" ]
    matchManagers: [ "gomod" ]
    matchPackageNames: [ "!/netcracker/i" ]
    minimumReleaseAge: "3 days"
  - description: "All repositories: automerge Maven minor and patch updates once every status check on the branch is green. Maven does not produce digest updates. The dependency-gate check is not required and runs in report mode, so it does not block the merge."
    matchManagers: [ "maven" ]
    matchUpdateTypes: [ "minor", "patch" ]
    automerge: true
    automergeType: "pr"
    platformAutomerge: false
  - description: "All repositories: let third-party Maven releases age 3 days before the automerge above can pick them up. Our own artifacts (com.netcracker.*) are not delayed."
    matchManagers: [ "maven" ]
    matchPackageNames: [ "!/^com\\.netcracker\\./" ]
    minimumReleaseAge: "3 days"

platform: "github"
platformAutomerge: true
postUpdateOptions:
  - "gomodUpdateImportPaths"
  - "gomodTidy"
prConcurrentLimit: 25
prCreation: "immediate"
prHourlyLimit: 5
printConfig: true
pruneStaleBranches: true
rebaseWhen: "behind-base-branch"
recreateWhen: "always"
reviewersFromCodeOwners: true
vulnerabilityAlerts:
  addLabels: [ "security" ]
  vulnerabilityFixStrategy: "lowest"