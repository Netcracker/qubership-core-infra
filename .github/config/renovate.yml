---
assignAutomerge: true
assigneesFromCodeOwners: true
autodiscover: false
binarySource: "install"
branchConcurrentLimit: 25
enabled: true
globalExtends:
  - ":ignoreModulesAndTests"
  - ":dependencyDashboard"
extends:
  - ":semanticCommitTypeAll(chore)"
minimumReleaseAge: "0 days"
hostRules:
  - hostType: "maven"
    matchHost: "maven.pkg.github.com"
    token: "{{ secrets.renovation_bot_private_packages_read }}"
packageRules:
  - matchManagers: [ "maven" ]
    matchPackageNames: [ "/.*/" ]
    addLabels: [ "manager:maven" ]
  - matchManagers: [ "dockerfile" ]
    matchPackageNames: [ "/.*/" ]
    addLabels: [ "manager:docker" ]
  - matchManagers: [ "gomod" ]
    matchPackageNames: [ "/.*/" ]
    addLabels: [ "manager:go" ]
  - matchManagers: [ "github-actions" ]
    matchPackageNames: [ "/.*/" ]
    addLabels: [ "manager:github-actions" ]
  - matchPackageNames:
      - "/.*/"
    allowedVersions: "!/.*(redhat|composite|groovyless|jboss|atlassian|preview|does-not-exist|-SNAPSHOT).*/"
  - matchDatasources: [ "maven" ]
    registryUrls:
      - "https://repo.maven.apache.org/maven2"
      - "https://maven.pkg.github.com/netcracker/*"
  - description: "Java base images: <java>-<os>-<version>, os flavour (alpine/ubi) is preserved"
    matchDatasources: [ "docker" ]
    matchPackageNames: [ "/.+/netcracker/qubership-java-base.*/" ]
    versioning: "regex:^(?<compatibility>\\d+-(?:alpine|ubi))-(?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+)$"
  - description: "Core/nginx base images: legacy unprefixed tags are treated as alpine and migrated to alpine-<version>, ubi-<version> stays ubi"
    matchDatasources: [ "docker" ]
    matchPackageNames: [ "/.+/netcracker/qubership-(core|nginx)-base$/" ]
    versioning: "regex:^(?:(?<compatibility>ubi)-|alpine-)?(?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+)$"
    allowedVersions: "/^(alpine|ubi)-\\d/"
  - matchDatasources: [ "docker" ]
    matchPackageNames: [ "golang" ]
    separateMinorPatch: true

platform: "github"
platformAutomerge: true
postUpdateOptions:
  - "gomodUpdateImportPaths"
  - "gomodTidy"
prConcurrentLimit: 25
prCreation: "immediate"
prHourlyLimit: 5
printConfig: true
pruneStaleBranches: true
rebaseWhen: "behind-base-branch"
recreateWhen: "always"
reviewersFromCodeOwners: true
vulnerabilityAlerts:
  addLabels: [ "security" ]
  vulnerabilityFixStrategy: "lowest"