# Maven Deploy Branch Snapshot Workflow
#
# Deploys Maven artifacts from a feature branch under branch-isolated SNAPSHOT versions:
# X.Y.Z-SNAPSHOT becomes X.Y.Z-<branch>-SNAPSHOT for the duration of the run, so the build
# does not overwrite what main published. Nothing is committed.
#
# Pick the branch in the "Use workflow from" dropdown. The workflow file has to exist on the
# selected branch, so a branch cut before this file landed on main needs main merged in first.
#
# Triggers:
#   - Manual dispatch
#
# See generic-maven-build.yaml in qubership-core-infra for the version-suffix input and its
# two constraints on SNAPSHOT dependencies.

name: Maven deploy (branch snapshot)

run-name: Deploy branch snapshot [${{ github.ref_name }}]

on:
  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'Skip Maven tests during deploy'
        required: false
        type: boolean
        default: true

jobs:
  maven-deploy:
    name: Maven deploy (branch snapshot)
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-maven-build.yaml@feat/consistent-snapshots-v2
    with:
      version-suffix: ${{ github.ref_name }}
      # -T 2C only pairs with skipped tests: parallel execution breaks the test suites.
      maven-command: ${{ inputs.skip-tests && 'deploy -T 2C -Dmaven.test.skip=true' || 'deploy' }}
      skip-docker: true
    secrets: inherit
