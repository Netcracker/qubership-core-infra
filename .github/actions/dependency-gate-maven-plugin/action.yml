# $schema: https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-action.json
name: "Install dependency-gate Maven plugin"
description: >
  Builds tools/dependency-gate-maven-plugin from the same revision as this action and installs it into the local
  Maven repository. The plugin is not published.
outputs:
  version:
    description: "Installed plugin version"
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - name: Install
      id: install
      shell: bash
      run: |
        set -euo pipefail
        plugin="$GITHUB_ACTION_PATH/../../../tools/dependency-gate-maven-plugin"
        mvn -B -ntp -s "$SETTINGS" -DskipTests -f "$plugin/pom.xml" install
        version=$(mvn -B -ntp -q -DforceStdout -f "$plugin/pom.xml" help:evaluate -Dexpression=project.version)
        echo "version=$version" >> "$GITHUB_OUTPUT"
