# $schema: https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-action.json
name: "Maven consumer check"
description: >
  Runs mvn verify for one consumer revision and writes findings.v1. The library is already installed and the poms
  already point at it; use-java-libs does that.
inputs:
  revision:
    description: "head or base"
    required: true
  consumer-dir:
    description: "Consumer checkout"
    required: true
  consumer-name:
    description: "<repo>/<module>, for the report"
    required: true
  maven-repo:
    description: "Local Maven repository for this revision. Empty or skip writes a skipped head finding and does not build."
    required: false
    default: ""
  out-dir:
    description: "Where the findings are written"
    required: false
    default: ""
  settings:
    description: "settings.xml for GitHub Packages"
    required: true
outputs:
  passed:
    description: "true when mvn verify succeeded. false when it failed. Empty when the consumer was skipped."
    value: ${{ steps.verify.outputs.passed }}
runs:
  using: composite
  steps:
    - name: Verify
      id: verify
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}
        REVISION: ${{ inputs.revision }}
        CONSUMER_DIR: ${{ inputs.consumer-dir }}
        CONSUMER_NAME: ${{ inputs.consumer-name }}
        REPO: ${{ inputs.maven-repo }}
        OUT_DIR: ${{ inputs.out-dir }}
        SETTINGS: ${{ inputs.settings }}
      run: |
        bash "$SCRIPTS/maven-consumer.sh" "$REVISION" "$CONSUMER_DIR" "${REPO:-skip}" \
          "${OUT_DIR:-$RUNNER_TEMP/dependency-gate-findings}" "$CONSUMER_NAME"
