# $schema: https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-action.json
name: "Dependency gate"
description: >
  Builds dependency-gate from the same revision of qubership-core-infra as this action and runs one command:
  detect (which ecosystems to check) or evaluate (apply the policy to the adapter findings, report, comment).
  See dependency-gate/DESIGN.md.
inputs:
  command:
    description: "detect | evaluate"
    required: true
  go-version:
    description: "Go to build the gate with (GO_VERSION of the reusable workflow)"
    required: true
  repo-dir:
    description: "Checkout of the checked repository"
    required: false
    default: "."
  findings-dir:
    description: "evaluate: directory with the findings.v1 files of the adapters; a missing directory means none"
    required: false
    default: ""
  expect:
    description: "evaluate: lines of adapter=<job result> for adapters that must have reported"
    required: false
    default: ""
  out-dir:
    description: "evaluate: where report.json, summary.md and comment.md are written (default $RUNNER_TEMP/dependency-gate)"
    required: false
    default: ""
  comment:
    description: "evaluate: write the Dependency gate comment and set the comment output to post or update"
    required: false
    default: "true"
  comment-note:
    description: "evaluate: write the Consumers comment (the fail fact and the run link) and set the comment output to post or delete"
    required: false
    default: "false"
  dry-run:
    description: "evaluate: do not fail the check; the summary and comment show a warning with the same findings"
    required: false
    default: "false"
  consumers:
    description: "detect: false turns reference consumers off. true keeps the infra list"
    required: false
    default: "true"
  gate-ref:
    description: "Revision of qubership-core-infra, written to the report"
    required: false
    default: ""
outputs:
  verdict:
    description: "evaluate: pass | warn | fail"
    value: ${{ steps.evaluate.outputs.verdict }}
  comment:
    description: "evaluate: post creates or replaces the sticky comment, update refreshes one that already exists, delete removes it"
    value: ${{ steps.evaluate.outputs.comment }}
  maven:
    description: "detect: true when the Maven adapter has something to check"
    value: ${{ steps.detect.outputs.maven }}
  maven-roots:
    description: "detect: JSON array of root pom directories"
    value: ${{ steps.detect.outputs.maven-roots }}
  go:
    description: "detect: true when the Go adapters have something to check"
    value: ${{ steps.detect.outputs.go }}
  go-modules:
    description: "detect: JSON array of Go module directories"
    value: ${{ steps.detect.outputs.go-modules }}
  config:
    description: "detect: effective configuration (infra defaults merged with the repository file), JSON"
    value: ${{ steps.detect.outputs.config }}
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ inputs.go-version }}
        # the module lies outside the workspace, where the cache key cannot be computed
        cache: false

    - name: Build dependency-gate
      shell: bash
      working-directory: ${{ github.action_path }}/../../../dependency-gate
      env:
        GOTOOLCHAIN: local
      run: go build -trimpath -o "$RUNNER_TEMP/dependency-gate-bin/dependency-gate" .

    - name: Detect
      id: detect
      if: inputs.command == 'detect'
      shell: bash
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        CONSUMERS: ${{ inputs.consumers }}
      run: python3 "$GITHUB_ACTION_PATH/../../../dependency-gate/ci.py" detect

    - name: Evaluate
      id: evaluate
      if: inputs.command == 'evaluate'
      shell: bash
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        FINDINGS_DIR: ${{ inputs.findings-dir }}
        EXPECT: ${{ inputs.expect }}
        OUT_DIR: ${{ inputs.out-dir }}
        COMMENT: ${{ inputs.comment }}
        COMMENT_NOTE: ${{ inputs.comment-note }}
        DRY_RUN: ${{ inputs.dry-run }}
        GATE_REF: ${{ inputs.gate-ref }}
      run: python3 "$GITHUB_ACTION_PATH/../../../dependency-gate/ci.py" evaluate
