name: Build Docker with Matrix Strategy

on:
  workflow_call:
    inputs:
      tags:
        required: false
        type: string
        default: ''
        description: 'Tags'
      dry-run:
        required: true
        type: boolean
        description: 'Dry run'
      config-filename:
        required: false
        type: string
        default: 'docker-dev-config.json'
        description: 'Set name only or short path inside .github folder if required'
      ref:
        required: false
        type: string
        description: 'Git reference to use for the build'
      build-args:
        description: 'Build arguments for the Docker image, in key=value format, one per line.'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  dry-run:
    name: Build Docker images without publishing
    if: ${{ inputs.dry-run == true }}
    permissions:
      contents: read
    uses: $/.github/workflows/docker-build-core.yaml
    with:
      tags: ${{ inputs.tags }}
      dry-run: true
      config-filename: ${{ inputs.config-filename }}
      ref: ${{ inputs.ref }}
      build-args: ${{ inputs.build-args }}

  publish:
    name: Build Docker images
    if: ${{ inputs.dry-run == false }}
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/docker-build-core.yaml
    with:
      tags: ${{ inputs.tags }}
      dry-run: false
      config-filename: ${{ inputs.config-filename }}
      ref: ${{ inputs.ref }}
      build-args: ${{ inputs.build-args }}
